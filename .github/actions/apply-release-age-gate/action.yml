name: Apply release-age gate
description: >-
  Write the organization's minimum-release-age policy into an ephemeral GitHub-hosted runner's
  GLOBAL package-manager configs (~/.bunfig.toml, ~/.yarnrc.yml, ~/.npmrc) before any install.
  WillBooster/shared's packages/wbfy/configs/releaseAgeGate.json is the single source of truth and
  the script next to it the single implementation, shared with the self-hosted runners
  (self-host-utils) and developer machines (wbfy), so every environment ends up with byte-identical
  settings. No package-manager version is probed: the organization runs only up-to-date package
  managers (npm >= 12, Yarn Berry >= 4.11, bun >= 1.3), pinned through the callers' mise.toml.
  Project-level configuration takes precedence in all three managers, so wbfied repositories keep
  their own (identical) gate and exclusion list.
runs:
  using: composite
  steps:
    - name: Apply the minimum-release-age policy to global package-manager configs
      shell: bash
      env:
        CONFIGS_URL: https://raw.githubusercontent.com/WillBooster/shared/main/packages/wbfy/configs
      run: |
        # Self-hosted runners are provisioned by self-host-utils with the same content from the same
        # policy file, and rewriting their machine-global configs from a job would race with the
        # installs of the other jobs sharing the machine.
        if [[ "${RUNNER_ENVIRONMENT:-}" != 'github-hosted' ]]; then exit 0; fi
        cd "$(mktemp -d)"
        # Retry: a momentary blip on an anonymous raw.githubusercontent.com fetch must not fail the job.
        curl --fail --show-error --silent --location --remote-name-all \
          --retry 5 --retry-all-errors --retry-delay 2 \
          "$CONFIGS_URL/applyReleaseAgeGate.sh" "$CONFIGS_URL/releaseAgeGate.json"
        bash applyReleaseAgeGate.sh
