name: Apply release-age gate
description: >-
  Write the organization's minimum-release-age policy into this runner's GLOBAL package-manager
  configs (~/.bunfig.toml, ~/.yarnrc.yml, ~/.npmrc) before any install. WillBooster/shared's
  packages/wbfy/configs/releaseAgeGate.json is the single source of truth and the script next to it
  the single implementation, shared with the self-hosted runners (self-host-utils) and developer
  machines (wbfy), so every environment ends up with byte-identical settings. Project-level
  configuration takes precedence in all three managers, so wbfied repositories keep their own
  (identical) gate and exclusion list.
runs:
  using: composite
  steps:
    - name: Apply the minimum-release-age policy to global package-manager configs
      shell: bash
      # The script rewrites only the gate keys and keeps the registry settings that precede them,
      # so this preserves the Takumi Guard proxy that self-host-utils provisions on the
      # self-hosted runners.
      env:
        CONFIGS_URL: https://raw.githubusercontent.com/WillBooster/shared/main/packages/wbfy/configs
      run: |
        cd "$(mktemp -d)"
        curl -fsSL -O "$CONFIGS_URL/applyReleaseAgeGate.sh" -O "$CONFIGS_URL/releaseAgeGate.json"
        bash applyReleaseAgeGate.sh
