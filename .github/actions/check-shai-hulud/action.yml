name: Check Shai-Hulud attack traces
description: >-
  Fail fast when the checked-out repository carries traces of the Shai-Hulud npm supply-chain
  worm (August 2026): the setup.mjs / Math_Symbol.js / math_init.js dropper and payload files,
  the injected "preinstall" hook, references to the attacker's exfiltration infrastructure, and
  the worm's disguised "chore: update config" commits that plant hooks in .claude/settings.json
  and .vscode/tasks.json. Must run right after checkout and BEFORE any dependency install so an
  infected tree never gets to execute its preinstall hook. IoCs from
  https://www.aikido.dev/blog/keyv-and-friends-compromised-in-active-shai-hulud-supply-chain-attack
runs:
  using: composite
  steps:
    - name: Scan the repository for Shai-Hulud indicators of compromise
      shell: bash
      run: |
        STATUS=0
        found() {
          echo "::error::Shai-Hulud trace: $1 — treat every credential reachable from this repository (npm/GitHub/AWS/…) as compromised and rotate it."
          STATUS=1
        }

        # 1. Dropper/payload files. A hash match is conclusive; the payload file names alone are
        #    distinctive enough to fail on, while `setup.mjs` is a plausible legitimate name, so a
        #    hash-mismatched setup.mjs only warns. node_modules (stale on persistent self-hosted
        #    workspaces) is deliberately included: an infected dependency materializes there.
        while IFS= read -r -d '' FILE; do
          if command -v sha256sum > /dev/null; then
            HASH=$(sha256sum "$FILE" | cut -d ' ' -f 1)
          else
            HASH=$(shasum -a 256 "$FILE" | cut -d ' ' -f 1)
          fi
          case $HASH in
            54dc7ea54a1317cca0e890a2770630cf7fa6c97813e0cb9d2caa93012b350668 | \
            fd3ca4007b225fdf8de7af4345a19179d5efa8c4bb9205f88cda806e5684b1eb | \
            9fc2570b7cef51c1b8df116d144d11ff4096357be7d2c4c6367cfc2509cf1bcc)
              found "known malicious file $FILE (SHA-256 $HASH)"
              ;;
            *)
              case ${FILE##*/} in
                Math_Symbol.js | math_init.js)
                  found "worm payload file name $FILE (SHA-256 $HASH is not a known sample; likely a repacked variant)"
                  ;;
                *)
                  echo "::warning::Shai-Hulud check: $FILE matches a dropper file name but not a known hash; inspect it manually."
                  ;;
              esac
              ;;
          esac
        done < <(find . -name .git -prune -o -type f \( -name 'setup.mjs' -o -name 'Math_Symbol.js' -o -name 'math_init.js' \) -print0)

        # 2. The injected install hook ("preinstall": "node setup.mjs").
        if grep -rn --include=package.json --exclude-dir=.git --exclude-dir=node_modules -E \
          '"preinstall"[[:space:]]*:[[:space:]]*"[^"]*setup\.mjs' .; then
          found 'a package.json declares a preinstall hook running setup.mjs'
        fi

        # 3. Attacker infrastructure: the fallback exfiltration endpoint, the Ethereum contract
        #    that serves it, and the drop-repository description. Bracketed characters keep these
        #    patterns from matching their own source if this file is ever scanned.
        if grep -rn -I --exclude-dir=.git --exclude-dir=node_modules -E \
          'npm-cache[.]com/router|0xE1f2395[e]e43e45A1556EC6438a88c31B83493103|Shai[-]Hulud: Here We Go Again' .; then
          found 'a file references the Shai-Hulud exfiltration infrastructure'
        fi

        # 4. The worm's repo-infection commits are authored as claude
        #    <claude@users.noreply.github.com> with the message "chore: update config". Shallow
        #    checkouts only expose recent commits, which are exactly the ones that matter here.
        if git log --format='%ae %s' 2> /dev/null | grep -qE '^claude@users[.]noreply[.]github[.]com chore: update config$'; then
          found 'a commit matches the worm signature (author claude@users.noreply.github.com, message "chore: update config")'
        fi

        if [[ $STATUS -ne 0 ]]; then
          echo '::error::Aborting before dependency installation. See https://www.aikido.dev/blog/keyv-and-friends-compromised-in-active-shai-hulud-supply-chain-attack'
        fi
        exit $STATUS
