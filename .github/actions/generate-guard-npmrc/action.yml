name: Generate Takumi Guard ~/.npmrc
description: >-
  Route ALL default-registry npm installs on this runner through the Takumi Guard proxy
  (https://flatt.tech/takumi/features/guard), which blocks known-malicious packages such as the
  Shai-Hulud worm releases. The workspace .npmrc generated by the install-capable reusable
  workflows only exists when the caller passes a registry token; this persistent ~/.npmrc
  additionally covers tokenless repositories and installs outside the workspace (e.g. ci-setup
  scripts running npx) via Guard's public anonymous token, which is not a secret and therefore
  safe to hardcode (a literal token also cannot trigger yarn1's undefined-env-var crash). Only
  the managed lines are rewritten so persistent self-hosted runner homes keep other user-level
  configuration.
runs:
  using: composite
  steps:
    - name: Generate ~/.npmrc routing the default npm registry through Takumi Guard
      shell: bash
      run: |
        NPMRC_TMP=$(mktemp "$RUNNER_TEMP/home-npmrc.XXXXXX")
        if [[ -f "$HOME/.npmrc" ]]; then
          grep -vE '^registry=|^//npm\.flatt\.tech/:_authToken' "$HOME/.npmrc" > "$NPMRC_TMP" || true
          if [[ -s "$NPMRC_TMP" && -n "$(tail -c1 "$NPMRC_TMP")" ]]; then echo >> "$NPMRC_TMP"; fi
        fi
        echo 'registry=https://npm.flatt.tech/' >> "$NPMRC_TMP"
        echo '//npm.flatt.tech/:_authToken=tg_anon_GhCM35SmGCSNcHWWldyq4PmOmPZRWTZ6w0Kwd36QIN4' >> "$NPMRC_TMP"
        : # Replace with mv so a pre-existing symlink cannot redirect the managed lines.
        rm -f "$HOME/.npmrc"
        mv "$NPMRC_TMP" "$HOME/.npmrc"
