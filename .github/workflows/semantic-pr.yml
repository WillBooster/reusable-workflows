name: Lint PR title

on:
  workflow_call:
    inputs:
      target_organization:
        required: false
        type: string

jobs:
  semantic-pr:
    if: ${{ !inputs.target_organization || github.repository_owner == inputs.target_organization }}
    runs-on: ${{ (toJSON(github.event.repository.private) == 'false' && 'ubuntu-latest') || fromJSON('["self-hosted", "medium"]') }}
    env:
      FORCE_COLOR: 3
    steps:
      - uses: amannn/action-semantic-pull-request@45b9ed7cf24087a2f7785bf55be97394ba87e1c2
        with:
          # PR titles become the squash commit messages, which WillBooster writes in English.
          subjectPattern: '^[^\u2e80-\u33ff\u3400-\u9fff\uf900-\ufaff\ufe30-\ufe4f\uff00-\uffef\ud82b-\ud82c\ud840-\ud8bf]+$'
          subjectPatternError: 'The subject "{subject}" contains Japanese characters. Write the PR title in English.'
          disallowScopes: '.*[\u2e80-\u33ff\u3400-\u9fff\uf900-\ufaff\ufe30-\ufe4f\uff00-\uffef\ud82b-\ud82c\ud840-\ud8bf].*'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
